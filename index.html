<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kīwaha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Fredoka:wght@400;600&family=Nunito:wght@500;700&family=Press+Start+2P&family=Quicksand:wght@500;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="output.css" />
  </head>
  <body>
    <div class="app">

      <!-- Forest only -->
      <div class="sun forest-only"></div>
      <div class="rays forest-only"></div>
      <div class="bubble forest-only" style="--size:36px; --left:10%; --delay:0s;   --dur:9s;  --start:10%"></div>
      <div class="bubble forest-only" style="--size:18px; --left:68%; --delay:2.5s; --dur:7s;  --start:14%"></div>
      <div class="bubble forest-only" style="--size:26px; --left:42%; --delay:5s;   --dur:11s; --start:8%"></div>
      <div class="bubble forest-only" style="--size:13px; --left:80%; --delay:1s;   --dur:8s;  --start:18%"></div>
      <div class="bubble forest-only" style="--size:21px; --left:26%; --delay:7s;   --dur:10s; --start:12%"></div>
      <div class="bubble forest-only" style="--size:10px; --left:55%; --delay:3.5s; --dur:6s;  --start:6%"></div>
      <svg class="grass forest-only" viewBox="0 0 260 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,48 Q48,8 104,38 Q160,65 212,22 Q234,8 260,32 L260,100 L0,100 Z" fill="rgba(34,197,94,0.45)"/>
        <path d="M0,68 Q70,38 140,60 Q192,76 260,48 L260,100 L0,100 Z" fill="rgba(22,163,74,0.7)"/>
        <path d="M0,84 Q86,66 172,78 Q222,86 260,70 L260,100 L0,100 Z" fill="rgba(21,128,61,0.88)"/>
      </svg>
      <div class="gloss forest-only"></div>

      <!-- Kawaii only -->
      <svg class="sparkles kawaii-only" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 360">
        <text x="18"  y="44"  font-size="16" fill="rgba(255,255,255,0.85)">✦</text>
        <text x="218" y="58"  font-size="11" fill="rgba(255,210,240,0.9)">✦</text>
        <text x="12"  y="210" font-size="9"  fill="rgba(255,255,255,0.65)">✧</text>
        <text x="228" y="168" font-size="13" fill="rgba(255,210,240,0.8)">✦</text>
        <text x="96"  y="28"  font-size="8"  fill="rgba(255,255,255,0.75)">✦</text>
        <text x="178" y="308" font-size="10" fill="rgba(255,210,240,0.75)">✧</text>
        <text x="36"  y="328" font-size="12" fill="rgba(255,255,255,0.65)">✦</text>
        <text x="198" y="248" font-size="7"  fill="rgba(255,210,240,0.85)">✦</text>
        <text x="140" y="18"  font-size="9"  fill="rgba(255,255,255,0.7)">✧</text>
        <text x="52"  y="80"  font-size="6"  fill="rgba(255,200,230,0.8)">✦</text>
      </svg>

      <!-- Pixel only -->
      <div class="scanlines pixel-only"></div>
      <div class="pixel-glow pixel-only"></div>

      <!-- Gothic only -->
      <div class="gothic-vignette gothic-only"></div>
      <div class="gothic-cross gothic-only">✠</div>

      <!-- Content -->
      <p class="label">kīwaha o te rā</p>
      <div class="card">
        <h1 id="kiiwaha"></h1>
        <p id="definition"></p>
      </div>

      <!-- Theme switcher -->
      <div class="theme-switcher">
        <button class="theme-btn" data-theme="forest">🌿</button>
        <button class="theme-btn" data-theme="kawaii">🌸</button>
        <button class="theme-btn" data-theme="pixel">👾</button>
        <button class="theme-btn" data-theme="gothic">⚜️</button>
      </div>

    </div>
    <script src="script.js"></script>
  </body>
</html>
